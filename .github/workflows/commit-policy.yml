name: Commit policy

# Reusable. Call from push and pull_request events.
# Policy: type(scope): #issue short imperative description.
# The validator lives in this repository (scripts/commit-policy.mjs) and is
# checked out at the same commit as this workflow, so callers stay in sync.
# A caller may keep its own grandfathering baseline in one of:
#   Scripts/commit-policy.json, scripts/commit-policy.json, .github/commit-policy.json
# Only its "legacyBase" is used, and it is read from the DEFAULT BRANCH, never
# from the pushed or pull-request commits, so a change cannot grandfather
# itself. A new or moved baseline takes effect once it is merged.
# Merge commits are exempt; PR titles are checked because they supply the
# proposed squash-merge subject.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  commit-policy:
    name: Commit policy
    # A newly-created branch push does not identify a PR base; the
    # pull_request event validates that branch against its real base instead.
    if: ${{ github.event_name != 'push' || !github.event.created }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out shared policy scripts
        uses: actions/checkout@v7
        with:
          repository: GemsForge/.github
          ref: ${{ github.job_workflow_sha }}
          path: .gemsforge-shared
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate commits and proposed squash subject
        # Messages and titles come from Git and the event JSON, never shell interpolation.
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          trusted="origin/$DEFAULT_BRANCH"
          for candidate in Scripts/commit-policy.json scripts/commit-policy.json .github/commit-policy.json; do
            if git cat-file -e "$trusted:$candidate" 2>/dev/null; then
              git show "$trusted:$candidate" > "$RUNNER_TEMP/caller-commit-policy.json"
              export COMMIT_POLICY_CONFIG="$RUNNER_TEMP/caller-commit-policy.json"
              echo "Using legacyBase from $trusted:$candidate"
              break
            fi
          done
          node .gemsforge-shared/scripts/commit-policy.mjs github
