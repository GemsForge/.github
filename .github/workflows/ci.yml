name: Shared workflow tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test shared workflows and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Sync workflow logic
        run: node --test .github/tests/sync-issue-workflow.test.cjs
      - name: Commit policy validator
        run: node --test scripts/commit-policy.test.mjs
      - name: Caller templates reference the current major version
        run: |
          bad=$(grep -L 'GemsForge/.github/.github/workflows/.*@v1$' templates/workflows/*.yml || true)
          if [ -n "$bad" ]; then echo "Callers not pinned to @v1: $bad"; exit 1; fi
