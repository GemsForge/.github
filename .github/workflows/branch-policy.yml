name: Branch workflow policy

# Reusable. Call from a repository with pull_request_target or pull_request.
# Requires branch <type>/<issue-number>-<short-description> and an issue
# reference in the PR body. Does not check out or run pull-request code.
on:
  workflow_call:
    inputs:
      allowed-base-branches:
        description: Comma-separated PR base branches. Blank means the default branch only.
        required: false
        type: string
        default: ""
      require-closing-keyword:
        description: Require "Closes #N" (or Fixes/Resolves) instead of a plain "#N".
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-and-link:
    name: Branch and issue linkage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate branch and issue reference
        uses: actions/github-script@v7
        env:
          ALLOWED_BASES: ${{ inputs.allowed-base-branches }}
          REQUIRE_CLOSING: ${{ inputs.require-closing-keyword }}
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed("Branch policy must be called from a pull_request or pull_request_target event.");
              return;
            }
            const defaultBranch = context.payload.repository?.default_branch;
            const allowed = (process.env.ALLOWED_BASES || "").split(",").map((v) => v.trim()).filter(Boolean);
            const bases = allowed.length ? allowed : [defaultBranch].filter(Boolean);
            if (!bases.includes(pr.base.ref)) {
              core.setFailed(`Pull requests must target ${bases.join(" or ") || "the default branch"}.`);
              return;
            }
            const branchPattern = /^(feat|fix|docs|refactor|test|chore|ci|build|perf|style)\/[1-9][0-9]*-[a-z0-9][a-z0-9-]*$/;
            if (!branchPattern.test(pr.head.ref)) {
              core.setFailed("Branch must match <type>/<issue-number>-<short-description>.");
              return;
            }
            const issue = pr.head.ref.match(/^[^/]+\/(\d+)-/)[1];
            const body = pr.body || "";
            if (process.env.REQUIRE_CLOSING === "true") {
              if (!new RegExp(`(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\\s+#${issue}\\b`, "i").test(body)) {
                core.setFailed(`PR body must include Closes #${issue} (or Fixes/Resolves).`);
              }
            } else if (!new RegExp(`#${issue}\\b`).test(body)) {
              core.setFailed(`PR body must reference #${issue}.`);
            }
