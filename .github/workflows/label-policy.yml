name: Story label policy

# Reusable. Call from pull_request_target with types including labeled.
# The PR title must equal its issue title and carry the type-compatible label.
# When the label is missing, it waits briefly for the metadata sync to copy
# labels from the issue, so brand-new PRs do not fail on a race.
on:
  workflow_call:
    inputs:
      label-wait-seconds:
        description: How long to wait for the metadata sync to add the type label.
        required: false
        type: number
        default: 60

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  label-policy:
    name: Require type-compatible story label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate title and required label
        uses: actions/github-script@v7
        env:
          LABEL_WAIT_SECONDS: ${{ inputs.label-wait-seconds }}
        with:
          script: |
            const eventPr = context.payload.pull_request;
            if (!eventPr) {
              core.setFailed("Label policy must be called from a pull_request or pull_request_target event.");
              return;
            }
            const loadPr = async () => (await github.rest.pulls.get({
              ...context.repo, pull_number: eventPr.number,
            })).data;
            let pr = await loadPr();
            const title = pr.title || "";
            const match = /^(feat|fix|refactor|test|docs|chore|ci)\(([a-z0-9-]+)\): #([1-9][0-9]*) ([a-z][a-z0-9-]*(?:\s+\S.*)?)$/.exec(title);
            if (!match) {
              core.setFailed("PR title must match type(scope): #issue short imperative description.");
              return;
            }
            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: Number(match[3]) });
            // Issue titles may carry the number ("type(scope): #N text") or not
            // ("type(scope): text"); the PR title always does.
            const numbered = issue.title.replace(/^([^:]+):\s+(?!#\d)/, `$1: #${match[3]} `);
            if (title !== issue.title && title !== numbered) {
              core.setFailed("PR title must match issue #" + match[3] + " title: \"" + numbered + "\".");
              return;
            }
            const required = {
              feat: "feature", fix: "fix", refactor: "refactor",
              test: "testing", docs: "documentation", chore: "chore", ci: "ci",
            }[match[1]];
            const hasLabel = (value) => (value.labels || []).some(({ name }) => name === required);
            const deadline = Date.now() + Number(process.env.LABEL_WAIT_SECONDS || 0) * 1000;
            while (!hasLabel(pr) && Date.now() < deadline) {
              await new Promise((resolve) => setTimeout(resolve, 10000));
              pr = await loadPr();
            }
            if (!hasLabel(pr)) {
              core.setFailed(`Missing required label: ${required}.`);
              return;
            }
            core.notice(`Label policy passed: ${required}.`);
